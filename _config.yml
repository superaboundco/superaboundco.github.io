# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# theme: jekyll-agency
remote_theme: raviriley/agency-jekyll-theme

title      : Superabound
name       : Home
email      : superaboundco@gmail.com #this is also the email contact forms will go to
tagline    : "Superabound is a data consulting company that helps non-profit organizations realize their missions and goals."
description: "Superabound is a boutique data consulting company that supports organizations (and funders) maximize their impact and outcomes using data."

author     : Superabound
url        : "https://simplysuperabound.com/" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog

# logo:     #optional, defaults to site title
  # path: assets\img\clients\creative-market.jpg
  # height: 60 #height in px, defaults to 52px

locale: "en-US" # See available languages in _data/sitetext.yml

analytics:
  google: #Google Analytics tracking code here

collections:
  portfolio:

markdown: kramdown

# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
# formspree_form_path: "f/a_form_id"

# Web3form
web3form_key: "dc91da12-f20f-42dc-b7f7-26ffd0c1597e"

# plugins
plugins:
  - jekyll-seo-tag