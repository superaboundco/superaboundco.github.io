<!-- Contact -->
{% if site.locale and site.locale != "" and site.locale != nil %}
<section class="page-section" id="{{ site.data.sitetext[site.locale].contact.section | default: "contact" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading text-uppercase">
          "Contact Us"
        </h2>
        <h3 class="section-subheading text-muted">""</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="{{ site.web3form_key }}">
          <input type="hidden" name="from_name" value="Superabound website contact form">
          <!--name="sentMessage"-->
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <input name="name" class="form-control" id="name" type="text"
                  placeholder="Name*"
                  required="required" data-validation-required-message="Please enter your name.">
                <p class="help-block text-danger"></p>
              </div>
              <div class="form-group">
                <input name="_replyto" class="form-control" id="email" type="email"
                  placeholder="Email*"
                  required="required" data-validation-required-message="Please enter your email address.">
                <p class="help-block text-danger"></p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group">
                <textarea name="message" class="form-control" id="message"
                  placeholder="Message*" required="required" data-validation-required-message="Please enter a message."></textarea>
                <p class="help-block text-danger"></p>
              </div>
            </div>
            <!-- <input type="hidden" name="_subject" id="email-subject"
              value="{{ site.data.sitetext[site.locale].contact.subject | default: "Contact Form Submission" }}"> -->
            <!-- <div class="clearfix"></div> -->
            <div class="col-lg-12 text-center">
              <div id="success"></div>
              <button id="sendMessageButton" class="btn btn-primary btn-xl text-uppercase"
                type="submit">Send Message</button>
            </div>
            <!-- Optional: Custom Redirection or Thank you Page Make sure you add full URL including https:// -->
            <!-- <input type="hidden" name="redirect" value="https://web3forms.com/success"> -->

            <!-- Optional: But Recommended: To Prevent SPAM Submission.
                Make sure its hidden by default -->
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
            
            <!-- hCaptcha: Recommended for Advanced Spam Protection. -->
            <!-- <div class="h-captcha" data-captcha="true"></div> -->

            <!-- <input type="text" name="_gotcha" style="display:none">
            <input type="hidden" name="_next" value="#" /> -->
            <!-- <script src="https://web3forms.com/client/script.js" async defer></script> -->
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% else %}

  </div>
</section>
